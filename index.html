<!DOCTYPE html>
<html lang="de">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>No Beer Challenge 2026</title>

    <meta name="description" content="Die legendäre No Beer Challenge bis zum Acoustic Campfire Festival." />

    <link rel="stylesheet" href="style.css">

<meta property="og:title" content="🔥 NO BEER CHALLENGE 2026">
<meta property="og:description" content="Kein Bier. Ein Ziel. Countdown bis zum Acoustic Campfire Festival.">
<meta property="og:image" content="assets/preview.jpg">
<meta property="og:type" content="website">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="🔥 NO BEER CHALLENGE 2026">
<meta name="twitter:description" content="Kein Bier. Ein Ziel. Countdown bis zum Acoustic Campfire Festival.">
<meta name="twitter:image" content="assets/preview.jpg">

<link rel="icon" type="image/png" href="assets/favicon.png">

</head>

<body>

<div class="background"></div>
<div class="overlay"></div>

<canvas id="particles"></canvas>

<main>

    <section class="hero">

        <div class="logo">

            <img class="edh-logo" src="assets/edh-logo.svg" alt="EDH Logo">

        </div>

        <h1>
            NO BEER
            <span>CHALLENGE</span>
        </h1>

        <p class="subtitle">

            Kein Bier.
            Ein Ziel.

        </p>

    </section>

    <section class="countdown-section">

        <div id="countdown">

            <div class="time-box">

                <span id="days">00</span>

                <small>Tage</small>

            </div>

            <div class="time-box">

                <span id="hours">00</span>

                <small>Stunden</small>

            </div>

            <div class="time-box">

                <span id="minutes">00</span>

                <small>Minuten</small>

            </div>

            <div class="time-box">

                <span id="seconds">00</span>

                <small>Sekunden</small>

            </div>

        </div>

    </section>

    <section class="event">

        <h2>Countdown bis</h2>

        <h3>Acoustic Campfire Festival</h3>

        <p>

            31. Juli 2026<br>

            10:00 Uhr

        </p>

    </section>

    <section class="progress-section">

        <div class="progress-wrapper">

            <div id="progressBar"></div>

        </div>

        <p id="progressText">

            Challenge startet...

        </p>

    </section>

    <section class="quote">

        <blockquote id="motivation">

            Kein Bier.
            Keine Ausreden.

        </blockquote>

    </section>

</main>

<div id="finished" class="hidden">

    <h2>🍺 Geschafft!</h2>

    <p>

        Die Challenge ist vorbei.

    </p>

    <h3>

        Prost auf das erste Bier!

    </h3>

</div>

<script src="script.js"></script>
<HTML>
<footer>

    <img src="assets/edh-logo.svg"
         class="footer-logo"
         alt="EDH Logo">

    <p>

        No Beer Challenge 2026

    </p>

</footer> 
</body>
</html>
